<div class="address-search">
  <label for="address-input">Adresse</label>
  <input id="address-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="address-results" aria-describedby="address-status" placeholder="Strasse, Hausnummer und Ort" autocomplete="off" spellcheck="false">
  <ul id="address-results" role="listbox" aria-label="Offizielle Adressvorschläge" hidden></ul>
  <div id="address-status" role="status" aria-live="polite">Ab drei Zeichen erscheinen offizielle Adressvorschläge.</div>
</div>
