name: Reproducible project setup
on:
  push:
    branches: [main]
    paths:
      - setup.py
      - requirements*
      - tests/**
      - scripts/smoke_app.py
      - src/**
      - .gitattributes
      - .github/workflows/setup.yml
  pull_request:
    paths:
      - setup.py
      - requirements*
      - tests/**
      - scripts/smoke_app.py
      - src/**
      - .gitattributes
      - .github/workflows/setup.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh-checkout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-full.lock
      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: brew list libomp || brew install libomp
      - name: Check recovery safeguards
        run: python -m unittest discover -s tests -p test_setup.py -v
      - name: Check Azure lifecycle safeguards
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p test_azure_lifecycle.py -v
      - name: Install full environment and verify predictions
        run: python setup.py
      - name: Verify environment reuse
        run: python setup.py --profile app
      - name: Read-only health check
        run: python setup.py --doctor
