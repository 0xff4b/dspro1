name: Azure Streamlit prototype
on:
  push:
    branches: [main]
    paths:
      - src/app.py
      - src/notebooks/models/**
      - src/external-sources/output_csv/model.csv
      - Dockerfile
      - requirements-app.txt
      - scripts/**
      - .dockerignore
      - .github/workflows/azure-prototype.yml
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, start, stop, status, delete]
        default: deploy
      delete_confirmation:
        description: "For delete, enter the resource group name"
        required: false
        type: string
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: azure-prototype
  cancel-in-progress: false
jobs:
  prototype:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AZURE_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTION: ${{ inputs.action || 'deploy' }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-dspro1-prototype' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'switzerlandnorth' }}
      AZURE_SKIP_PROVIDER_REGISTRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration before building
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          PULL_USER: ${{ vars.GHCR_USERNAME }}
          PULL_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DELETE_CONFIRMATION: ${{ inputs.delete_confirmation }}
        run: |
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$AZURE_SUBSCRIPTION_ID"
          if [[ "$ACTION" == deploy ]]; then
            test -n "$PULL_USER" && test -n "$PULL_TOKEN" || { echo "Configure GHCR_USERNAME and GHCR_READ_TOKEN."; exit 1; }
          fi
          if [[ "$ACTION" == delete ]]; then
            test "$DELETE_CONFIRMATION" = "$AZURE_RESOURCE_GROUP"
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check lifecycle safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Build and test the Docker image
        if: env.ACTION == 'deploy'
        run: |
          docker build --platform linux/amd64 -t dspro1:test .
          docker run --rm --memory 1g --cpus 0.5 -v "$PWD/scripts/smoke_app.py:/tmp/smoke_app.py:ro" dspro1:test python /tmp/smoke_app.py
      - name: Publish private image to GHCR
        if: env.ACTION == 'deploy'
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          printf '%s' "$PUSH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag dspro1:test "$IMAGE"
          docker push "$IMAGE"
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy or manage Azure prototype
        env:
          REGISTRY_USERNAME: ${{ vars.GHCR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [[ "$ACTION" == delete ]]; then
            bash scripts/azure.sh delete --yes
          else
            bash scripts/azure.sh "$ACTION"
          fi
      - name: Remove runner registry credentials
        if: always()
        run: docker logout ghcr.io || true
